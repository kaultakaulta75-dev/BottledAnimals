name: Build 1.21.1 NeoForge

on:
  push:
    branches: [ "1.21.1-neoforge" ]
  pull_request:
    branches: [ "1.21.1-neoforge" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Refresh Gradle wrapper
        run: gradle wrapper --gradle-version 9.2.1
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: bottledanimals-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
